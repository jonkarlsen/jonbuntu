[project]
name = "jonbuntu"
version = "0.1.0"
description = "Let's host"
authors = [{name = "Jon", email = "karlsen.jon.a@gmail.com"}]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "psutil",
    "jinja2",
    "aiofiles",
    "aioboto3>=15.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "jsbeautifier",
    "cssbeautifier",
    "ty",
    "mypy",
    "types-psutil",
]

[tool.ruff]
line-length = 88
target-version = "py313"
fix = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.119",
    "mypy>=1.15",
    "ruff>=0.9",
    "ty>=0.0.2",
]
